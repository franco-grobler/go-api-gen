name: Commits

# Every commit is a conventional commit of a type cliff.toml allows: the
# changelog is written from them, so one that is not would be dropped from it
# or fail the release. git-cliff does the checking, with the same rules it
# writes the changelog by.
on:
  push:
    branches: [main]
  pull_request:
    # edited: a retitled pull request is checked again.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with prepare-release.yml.
  GIT_CLIFF_VERSION: 2.13.1

jobs:
  conventional:
    name: Commits are conventional
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@${{ env.GIT_CLIFF_VERSION }}

      - name: Check the commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range=$PR_BASE..$PR_HEAD
          elif [[ $BEFORE =~ ^0+$ ]]; then
            range=$AFTER
          else
            range=$BEFORE..$AFTER
          fi
          git cliff --config cliff.toml "$range" -o /dev/null

      # A squash merge commits the pull request's title, so it is held to
      # the same rules as a commit.
      - name: Check the pull request title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: scripts/check-commit-msg.sh -m "$TITLE"
