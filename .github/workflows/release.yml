name: Release

# A release is a pair of tags on one commit: vX.Y.Z for the generator and
# runtime/vX.Y.Z for the runtime module. prepare-release.yml creates both, on
# the commit that adds the release to CHANGELOG.md, and pushes them together.
# The notes are that release's entry, which git-cliff writes again here.
# Go needs nothing more: the module proxy serves a version straight from its
# tag. This workflow checks the pair, runs CI on the tagged commit, and
# records the release on GitHub.
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  verify:
    name: Tags are a releasable pair
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a semantic version."
            exit 1
          fi
          # A generator without its runtime emits code nothing can build.
          if ! git rev-parse --quiet --verify "refs/tags/runtime/$TAG" \
              >/dev/null; then
            echo "::error::runtime/$TAG is missing. Push both tags together:"
            echo "git push --atomic origin $TAG runtime/$TAG"
            exit 1
          fi
          if [ "$(git rev-parse "$TAG^{commit}")" != \
               "$(git rev-parse "runtime/$TAG^{commit}")" ]; then
            echo "::error::$TAG and runtime/$TAG are on different commits."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG" origin/main; then
            echo "::error::$TAG is not on main."
            exit 1
          fi

  ci:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Keep in step with GIT_CLIFF_VERSION in commits.yml.
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.13.1

      # The release's entry, as CHANGELOG.md has it, then how to install it.
      - name: Write the notes
        run: |
          git cliff --config cliff.toml --latest --strip all >notes.md
          cat >>notes.md <<EOF

          ## Install

          \`\`\`sh
          go install github.com/franco-grobler/go-api-gen/cmd/go-api-gen@$TAG
          go get github.com/franco-grobler/go-api-gen/runtime@$TAG
          \`\`\`

          Generated code and the runtime are released together. Use the same
          version of both.
          EOF

      # A version with a suffix, such as v1.2.0-rc.1, is a pre-release.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ $TAG == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file notes.md "${flags[@]}"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # The proxy would fetch both on first use anyway. Asking now makes the
      # first `go install` fast and lists the version on pkg.go.dev.
      - name: Warm the module proxy
        env:
          GOPROXY: https://proxy.golang.org
          MODULE: github.com/franco-grobler/go-api-gen
        run: |
          go list -m "$MODULE@$TAG"
          go list -m "$MODULE/runtime@$TAG"
