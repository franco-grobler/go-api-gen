name: Commits

# Every commit is a conventional commit of a type cliff.toml allows: the
# changelog is written from them, so one that is not would be dropped from it
# or fail the release. committed checks the message's style, per
# committed.toml, and git-cliff that it can file the commit, by the same rules
# it writes the changelog with. The commit-msg hook (`just hooks`) runs both.
on:
  push:
    branches: [main]
  pull_request:
    # edited: a retitled pull request is checked again.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with prepare-release.yml, release.yml and devbox.json. The
  # checksums are the release assets' own, as their release pages list them.
  GIT_CLIFF_VERSION: 2.13.1
  GIT_CLIFF_SHA256: 200d2535da6d9703f3bcc8a4d159c3b55eacdb01cf2148c55b3eee9dd04d5249
  # Keep in step with devbox.json.
  COMMITTED_VERSION: 1.1.11
  COMMITTED_SHA256: 1e5c20049eeaa4633e6798283913f92dc90a97f2b5c6dfc28e8c4b7e77a67157

jobs:
  conventional:
    name: Commits are conventional
    runs-on: docker
    container:
      image: node:24.12.0-bookworm
    steps:
      - uses: https://data.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      # Release tarballs, each checked against its pinned checksum before it
      # is unpacked: the tools that judge a commit are not taken on trust.
      - name: Install git-cliff and committed
        run: |
          cd "$(mktemp -d)"
          curl -fsSLo git-cliff.tar.gz "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSLo committed.tar.gz "https://github.com/crate-ci/committed/releases/download/v${COMMITTED_VERSION}/committed-v${COMMITTED_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          sha256sum -c - <<SUMS
          $GIT_CLIFF_SHA256  git-cliff.tar.gz
          $COMMITTED_SHA256  committed.tar.gz
          SUMS
          tar -xzf git-cliff.tar.gz --strip-components=1 -C /usr/local/bin \
            "git-cliff-${GIT_CLIFF_VERSION}/git-cliff"
          tar -xzf committed.tar.gz -C /usr/local/bin ./committed
          git-cliff --version
          committed --version

      # committed opens the repository through libgit2, and git-cliff too,
      # and both refuse a checkout owned by another user -- which a
      # container's root and the runner's mount are.
      - run: git config --global --add safe.directory "$PWD"

      - name: Check the commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range=$PR_BASE..$PR_HEAD
          elif [[ $BEFORE =~ ^0+$ ]]; then
            range=$AFTER
          else
            range=$BEFORE..$AFTER
          fi
          echo "Checking $range"
          committed "$range"
          git cliff --config cliff.toml "$range" -o /dev/null

      # A merge commit is titled with the pull request's title and number
      # (the repository's merge setting), so that is what is held to the
      # rules of a commit, suffix included. Through env, never interpolated
      # into the script: a title is anyone's text.
      - name: Check the pull request title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }} (#${{ github.event.pull_request.number }})
        run: |
          printf '%s\n' "$TITLE" | committed --commit-file -
          scripts/check-commit-msg.sh -m "$TITLE"
