components:
  schemas:
    User:
      description: A person or machine identity known to the platform.
      type: object
      required: [id, email, status]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          x-validate: [corporate_domain]
        display_name:
          description: Shown in the UI; absent when the user has not set one.
          type: [string, "null"]
        status:
          $ref: '#/components/schemas/UserStatus'
        address:
          $ref: '#/components/schemas/Address'
        created_at:
          type: string
          format: date-time

    UserStatus:
      type: string
      enum: [active, suspended, pending_verification]

    Address:
      type: object
      required: [line1, country]
      properties:
        line1: { type: string }
        line2: { type: string }
        country:
          type: string
          minLength: 2
          maxLength: 2

    # Declared but reached by no service; it must stay out of every bundle.
    AuditRecord:
      type: object
      properties:
        actor: { $ref: '#/components/schemas/User' }
