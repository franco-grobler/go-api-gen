openapi: 3.1.0
info:
  title: Identity
  version: "1.0.0"
paths:
  /users/{userId}:
    get:
      operationId: getUser
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: { $ref: ../../schema/user.yaml#/components/schemas/User }
        "404":
          description: No such user.
