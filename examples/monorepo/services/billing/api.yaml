openapi: 3.1.0
info:
  title: Billing
  version: "1.0.0"
paths:
  /invoices:
    parameters:
      - $ref: ../../schema/common.yaml#/components/parameters/Cursor
      - $ref: ../../schema/common.yaml#/components/parameters/Limit
    get:
      operationId: listInvoices
      summary: List invoices
      parameters:
        - name: due_by
          in: query
          description: Only invoices due on or before this day.
          schema: { type: string, format: date }
      responses:
        "200":
          description: A page of invoices.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Invoice' }
                  page: { $ref: ../../schema/common.yaml#/components/schemas/PageInfo }
    post:
      operationId: createInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvoice' }
      responses:
        "201":
          description: The created invoice.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
  /invoices/{invoiceId}/void:
    post:
      operationId: voidInvoice
      summary: Void an invoice
      description: >-
        The body is optional: send none to void an invoice without saying
        why, or one that gives the reason.
      parameters:
        - { name: invoiceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoidInvoice' }
      responses:
        "200":
          description: The voided invoice.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
components:
  schemas:
    Invoice:
      type: object
      required: [id, payer, total, status]
      properties:
        id: { type: string, format: uuid }
        payer: { $ref: ../../schema/user.yaml#/components/schemas/User }
        total: { $ref: ../../schema/common.yaml#/components/schemas/Money }
        status:
          type: string
          enum: [draft, open, paid, void]
        lines:
          type: array
          items:
            type: object
            required: [description, amount]
            properties:
              description: { type: string, minLength: 1 }
              amount: { $ref: ../../schema/common.yaml#/components/schemas/Money }
        void_reason: { type: string }
        due_on:
          type: string
          format: date
          description: The day payment is due, when the invoice has one.

    CreateInvoice:
      type: object
      required: [payer_id, total]
      properties:
        payer_id: { type: string, format: uuid }
        total: { $ref: ../../schema/common.yaml#/components/schemas/Money }
        note: { type: string, maxLength: 500 }
        due_on: { type: string, format: date }

    VoidInvoice:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
